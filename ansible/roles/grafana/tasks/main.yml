---
- name: Add Grafana GPG key
  ansible.builtin.rpm_key:
    key: "{{ grafana_gpg_key_url }}"
    state: present

- name: Add Grafana yum repository
  ansible.builtin.yum_repository:
    name: grafana
    description: Grafana OSS repository
    baseurl: "{{ grafana_repo_baseurl }}"
    gpgcheck: true
    gpgkey: "{{ grafana_gpg_key_url }}"
    repo_gpgcheck: true
    enabled: true

- name: Check if grafana package is installed
  ansible.builtin.command: "rpm -q grafana-{{ grafana_version }}-1.x86_64"  # noqa: command-instead-of-module
  register: grafana_rpm_check
  changed_when: false
  failed_when: false

- name: Install grafana package
  # ansible.builtin.dnf misreports this install as a failed
  # "already installed" transaction test on AL2023's dnf4 bindings;
  # the dnf CLI itself does not hit this bug
  ansible.builtin.command: "dnf install -y grafana-{{ grafana_version }}-1.x86_64"  # noqa: command-instead-of-module
  when: grafana_rpm_check.rc != 0
  register: grafana_install
  changed_when: grafana_rpm_check.rc != 0

- name: Ensure datasource provisioning directory exists
  ansible.builtin.file:
    path: /etc/grafana/provisioning/datasources
    state: directory
    owner: root
    group: grafana
    mode: "0750"

- name: Provision Prometheus datasource
  ansible.builtin.template:
    src: prometheus-datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana-server

- name: Ensure grafana-server is enabled and started
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started
