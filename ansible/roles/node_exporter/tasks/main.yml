---
- name: Create node_exporter system group
  ansible.builtin.group:
    name: "{{ node_exporter_system_group }}"
    system: true

- name: Create node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_system_user }}"
    group: "{{ node_exporter_system_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Ensure download directory exists
  ansible.builtin.file:
    path: "{{ node_exporter_download_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download and verify node_exporter archive
  ansible.builtin.get_url:
    url: "{{ node_exporter_release_url }}/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: "{{ node_exporter_download_dir }}/node_exporter.tar.gz"
    checksum: "{{ node_exporter_checksum }}"
    mode: "0644"

- name: Extract node_exporter archive
  ansible.builtin.unarchive:
    src: "{{ node_exporter_download_dir }}/node_exporter.tar.gz"
    dest: "{{ node_exporter_download_dir }}"
    remote_src: true

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "{{ node_exporter_download_dir }}/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: "{{ node_exporter_bin_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart node_exporter

- name: Install node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart node_exporter

- name: Ensure node_exporter is enabled and started
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
