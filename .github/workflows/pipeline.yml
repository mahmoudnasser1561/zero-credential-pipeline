name: pipeline

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "ansible/**"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  tfsec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          pip install --quiet ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yml
          ansible-lint ansible/roles

  terraform-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - working-directory: terraform
        run: |
          terraform init -input=false
          terraform plan -no-color -input=false

  stackcheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: stackcheck/go.mod
          cache-dependency-path: stackcheck/go.sum

      - working-directory: stackcheck
        run: |
          go vet ./...
          go build ./...
          go test ./...
          docker build -t stackcheck:ci .

  apply:
    needs: [tfsec, ansible-lint, terraform-plan, stackcheck-build]
    runs-on: ubuntu-latest
    environment: provision
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - working-directory: terraform
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: Install Ansible tooling
        run: |
          pip install --quiet ansible "boto3>=1.35.0" "botocore>=1.35.0"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Install SSM Session Manager plugin
        run: |
          curl -sL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb

      - name: Wait for instance SSM registration
        run: .github/scripts/wait-for-ssm-ready.sh

      - name: Configure common
        working-directory: ansible
        run: ansible-playbook site.yml --tags common

      - name: Configure node_exporter
        working-directory: ansible
        run: ansible-playbook site.yml --tags node_exporter

      - name: Configure prometheus
        working-directory: ansible
        run: ansible-playbook site.yml --tags prometheus

      - name: Configure grafana
        working-directory: ansible
        run: ansible-playbook site.yml --tags grafana

      - name: Verify idempotency (second run must report no changes)
        run: .github/scripts/check-ansible-idempotent.sh ansible

      - name: Build stackcheck image
        working-directory: stackcheck
        run: docker build -t stackcheck:ci .

      - name: Run stackcheck
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            stackcheck:ci --target-type ec2 --region "${{ vars.AWS_REGION }}" \
            --tag "Project=zero-credential-pipeline" --format text

  destroy:
    needs: apply
    if: always()
    runs-on: ubuntu-latest
    environment: teardown
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - working-directory: terraform
        run: |
          terraform init -input=false
          terraform destroy -auto-approve -input=false
