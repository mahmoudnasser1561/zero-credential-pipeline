name: pipeline

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "ansible/**"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  tfsec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          pip install --quiet ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yml
          ansible-lint ansible/roles

  terraform-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - working-directory: terraform
        run: |
          terraform init -input=false
          terraform plan -no-color -input=false

  apply:
    needs: [tfsec, ansible-lint, terraform-plan]
    runs-on: ubuntu-latest
    environment: provision
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - working-directory: terraform
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: Install Ansible tooling
        run: |
          pip install --quiet ansible "boto3>=1.35.0" "botocore>=1.35.0"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Install SSM Session Manager plugin
        run: |
          curl -sL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb

      - name: Wait for instance SSM registration
        run: .github/scripts/wait-for-ssm-ready.sh

      - name: Configure via Ansible
        working-directory: ansible
        run: ansible-playbook site.yml

      - name: Verify idempotency (second run must report no changes)
        run: .github/scripts/check-ansible-idempotent.sh ansible

  destroy:
    needs: apply
    if: always()
    runs-on: ubuntu-latest
    environment: teardown
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - working-directory: terraform
        run: |
          terraform init -input=false
          terraform destroy -auto-approve -input=false
